name: Release Assets

permissions:
  contents: write

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to release (e.g. v0.1.4)'
        required: true

jobs:
  upload-assets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install dependencies (Linux AArch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libssl-dev pkg-config
      
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: grafana-tui
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

  publish-checksums:
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag || '' }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          REF_NAME: ${{ github.ref_name || '' }}
        run: |
          set -euo pipefail

          release_tag="${INPUT_RELEASE_TAG:-}"
          if [[ -z "${release_tag}" ]]; then
            release_tag="${EVENT_RELEASE_TAG:-}"
          fi
          if [[ -z "${release_tag}" ]]; then
            release_tag="${REF_NAME:-}"
          fi

          release_tag="${release_tag#refs/tags/}"
          if [[ -z "${release_tag}" ]]; then
            echo "::error::Unable to resolve release tag."
            exit 1
          fi

          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"

      - name: Publish checksum manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          checksum_dir="$(mktemp -d "${RUNNER_TEMP}/grafana-tui-checksums.XXXXXX")"
          cleanup() {
            case "${checksum_dir}" in
              "${RUNNER_TEMP}"/grafana-tui-checksums.*)
                rm -rf "${checksum_dir}"
                ;;
            esac
          }
          trap cleanup EXIT

          assets=(
            grafana-tui-x86_64-apple-darwin.tar.gz
            grafana-tui-aarch64-apple-darwin.tar.gz
            grafana-tui-x86_64-unknown-linux-gnu.tar.gz
            grafana-tui-aarch64-unknown-linux-gnu.tar.gz
          )

          for asset in "${assets[@]}"; do
            curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
              --output "${checksum_dir}/${asset}" \
              "${base_url}/${asset}"
          done

          (
            cd "${checksum_dir}"
            sha256sum "${assets[@]}" > grafana-tui-checksums.txt
          )

          gh release upload "${RELEASE_TAG}" \
            "${checksum_dir}/grafana-tui-checksums.txt" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
